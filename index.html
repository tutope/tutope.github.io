<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B1424">
<meta name="description" content="Reparte tu plata antes de gastarla.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plata">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plata del Mes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --n900:#0B1424; --n850:#0F1B2E; --n800:#152238; --n750:#1A2B45; --n700:#22364F; --n650:#2C4363;
  --tx:#E9EFF8; --tx2:#93A7C4; --tx3:#5F7899;
  --verde:#31D3A0; --verde-d:#0E3D30;
  --rojo:#FF6060; --rojo-d:#3A1620;
  --ambar:#F5B33C; --ambar-d:#3A2A10;
  --c1:#31D3A0; --c2:#F5B33C; --c3:#6C8FF5; --c4:#C77DF0; --c5:#4FC7E8; --c6:#FF8FA3;
}
*{box-sizing:border-box}
html{background:var(--n900)}
body{margin:0;background:var(--n900);color:var(--tx);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:8px}
.mono{font-family:"DM Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3)}

.shell{max-width:470px;margin:0 auto;min-height:100vh;background:var(--n900);position:relative}
.scroll{padding-bottom:150px}

/* nav superior */
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px}
.nav .ttl{font-weight:700;font-size:15px}
.nav .ic{width:30px;height:30px;border-radius:10px;background:var(--n800);display:flex;align-items:center;justify-content:center}
.nav .ic svg{width:15px;height:15px;stroke:var(--tx2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.body{padding:0 16px}
.blk{background:var(--n800);border-radius:16px;padding:15px;margin-bottom:11px}
.blk.tight{padding:13px 15px}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bh h3{margin:0;font-size:13.5px;font-weight:700}
.bt{font-size:11.5px;color:var(--tx2);font-weight:500}
.link{font-size:11.5px;color:var(--verde);font-weight:600}

.amt{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.12;margin-top:3px}
.amt.neg{color:var(--rojo)}
.amt .of{display:block;font-size:11.5px;font-weight:500;color:var(--tx2);letter-spacing:0;margin-top:3px}
.ring{width:72px;height:72px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--rc,var(--verde)) calc(var(--p)*1%),rgba(255,255,255,.07) 0);
  transition:background .5s ease}
.ring i{width:58px;height:58px;border-radius:50%;background:var(--n800);display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:800;font-style:normal}
.minis{display:flex;gap:8px;margin-top:12px}
.mini{flex:1;background:rgba(255,255,255,.045);border-radius:12px;padding:9px 11px}
.mini .k2{font-size:10.5px;color:var(--tx2);font-weight:500}
.mini b{display:block;font-weight:800;font-size:15.5px;margin-top:1px}
.mini b.hot{color:var(--rojo)}
.mini b.ok{color:var(--verde)}
.mini b.warn2{color:var(--ambar)}
.segbar{height:7px;border-radius:99px;background:var(--n700);overflow:hidden}
.segbar i{display:block;height:100%;border-radius:99px;background:var(--ambar);transition:width .4s cubic-bezier(.2,.8,.2,1)}

.pace{display:flex;align-items:center;gap:8px;margin-top:11px;padding:9px 11px;border-radius:11px;font-size:12px;line-height:1.4}
.pace.ok{background:var(--verde-d);color:var(--verde)}
.pace.bad{background:var(--rojo-d);color:var(--rojo)}
.pace i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;margin-top:5px}
.pace span{flex:1;min-width:0}

canvas{display:block;width:100%;height:120px}

/* barras de cuenta */
.br{padding:11px 0;cursor:pointer}
.br+.br{border-top:1px solid rgba(255,255,255,.055)}
.br .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:7px;gap:8px}
.br .t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .t span{color:var(--tx2);font-size:11.5px;font-variant-numeric:tabular-nums;font-family:"DM Mono",monospace;flex:none}
.br .tk{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.br .tk i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.25,1)}
.br .tk .mk{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.35)}
.br .sub{font-size:10.5px;color:var(--tx3);margin-top:6px;font-family:"DM Mono",monospace}

/* zona roja */
.red{background:var(--rojo-d);border:1px solid rgba(255,96,96,.28);border-radius:16px;padding:14px 15px;margin-bottom:11px}
.red .rh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.red .rh .dot{width:6px;height:6px;border-radius:50%;background:var(--rojo)}
.red .rh h3{margin:0;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rojo)}
.red .rh .tt{margin-left:auto;font-size:13px;font-weight:800;color:var(--rojo);font-variant-numeric:tabular-nums}
.red .rr{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13px;width:100%;text-align:left}
.red .rr+.rr{border-top:1px solid rgba(255,96,96,.16)}
.red .rr .nm{flex:1;font-weight:600}
.red .rr .nm em{display:block;font-style:normal;font-family:"DM Mono",monospace;font-size:10.5px;color:var(--tx3);margin-top:1px}
.red .rr .ex{font-weight:800;color:var(--rojo);font-variant-numeric:tabular-nums}
.okbox{background:var(--verde-d);border:1px solid rgba(49,211,160,.25);border-radius:16px;padding:13px 15px;
  margin-bottom:11px;font-size:12.5px;color:var(--verde);display:flex;align-items:center;gap:9px}
.okbox b{font-weight:700}

/* movimientos */
.mv{display:flex;align-items:center;gap:11px;padding:10px 0;width:100%;text-align:left}
.mv+.mv{border-top:1px solid rgba(255,255,255,.055)}
.mv .av{width:32px;height:32px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800}
.mv .in{flex:1;min-width:0}
.mv .in b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .in span{display:block;font-size:10.5px;color:var(--tx3);font-family:"DM Mono",monospace}
.mv .in span.cob{color:var(--ambar);margin-top:1px}
.mv .vv{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.mv .vv.auto{color:var(--tx2)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;
  border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:2px}
.dayh .d1{font-size:12px;font-weight:600;color:var(--tx2)}
.dayh .d2{font-size:11.5px;font-family:"DM Mono",monospace;color:var(--tx3)}
.filt{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.fc{flex:none;border:1px solid var(--n700);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--tx2);
  display:flex;align-items:center;gap:6px;background:var(--n800)}
.fc i{width:6px;height:6px;border-radius:50%}
.fc.on{border-color:var(--verde);color:var(--tx);background:var(--verde-d)}
.blank{text-align:center;color:var(--tx3);font-size:13px;padding:44px 24px;line-height:1.7}

/* plan */
.dsg{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;font-size:13.5px}
.dsg+.dsg{border-top:1px solid rgba(255,255,255,.055)}
.dsg .n2{color:var(--tx2)}
.dsg .v2{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;font-weight:500}
.dsg.tot{border-top:1px solid var(--n650);margin-top:4px;padding-top:11px}
.dsg.tot .n2{color:var(--tx);font-weight:700}
.dsg.tot .v2{font-weight:800;font-size:16px;color:var(--verde)}
.dsg .v2.rest{color:var(--rojo)}

.row{display:flex;align-items:center;gap:9px;padding:10px 0}
button.row{width:100%;text-align:left;background:none;border:none;font:inherit;color:inherit;cursor:pointer}
button.row:active{opacity:.7}
button.row:disabled{cursor:default}
.row+.row{border-top:1px solid rgba(255,255,255,.055)}
.row .sw{width:26px;height:26px;border-radius:9px;flex:none}
.row .rn{flex:1;min-width:0}
.row .rn b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rn span{font-size:10.5px;color:var(--tx3);font-family:"DM Mono",monospace}
.row .rv{font-family:"DM Mono",monospace;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.row .x{color:var(--tx3);padding:6px;flex:none;font-size:14px}
.row .x:hover{color:var(--rojo)}

input[type=text],input[type=number],input[type=password],input[type=email]{background:var(--n900);border:1px solid var(--n700);border-radius:11px;
  padding:11px 12px;font-size:14px;width:100%;min-width:0;font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}
input[type=text],input[type=email]{font-family:"Plus Jakarta Sans",sans-serif}
input[type=password]{letter-spacing:.18em}
input:focus{border-color:var(--verde);outline:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--n700);border-radius:99px}
input[type=range]::-moz-range-track{height:5px;background:var(--n700);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8.5px;
  background:var(--verde);border:3px solid var(--n800);border-radius:50%}
input[type=range]::-moz-range-thumb{width:22px;height:22px;background:var(--verde);border:3px solid var(--n800);border-radius:50%}
textarea{width:100%;min-height:78px;background:var(--n900);border:1px solid var(--n700);border-radius:11px;
  padding:10px;font-family:"DM Mono",monospace;font-size:11px;color:var(--tx2);resize:vertical}
.fld{margin-bottom:11px}
.fld .lb{font-size:11.5px;color:var(--tx2);margin-bottom:6px;font-weight:500}

.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:13px;font-weight:700;font-size:14px;
  background:var(--n750);color:var(--tx);transition:filter .12s}
.btn:active{filter:brightness(1.12)}
.btn.pri{background:var(--verde);color:#04241B}
.btn.dgr{background:var(--rojo-d);color:var(--rojo)}
.btn.gh{background:transparent;border:1px solid var(--n700);color:var(--tx2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sp{height:9px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:700}
.pill.ok{background:var(--verde-d);color:var(--verde)}
.pill.warn{background:var(--ambar-d);color:var(--ambar)}
.pill.hot{background:var(--rojo-d);color:var(--rojo)}

/* barra inferior */
.navwrap{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.navin{width:100%;max-width:470px;pointer-events:auto;background:linear-gradient(180deg,rgba(11,20,36,.6),var(--n900) 40%);
  backdrop-filter:blur(12px);padding:10px 16px calc(8px + env(safe-area-inset-bottom))}
.cta{display:grid;grid-template-columns:1fr auto auto;gap:7px}
.cta .p{background:var(--verde);color:#04241B;border-radius:14px;padding:14px;font-weight:800;font-size:14.5px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.cta .s{background:var(--n800);color:var(--tx2);border-radius:14px;padding:14px 13px;font-weight:700;font-size:13px}
.cta .a{background:var(--verde-d);color:var(--verde);border-radius:14px;padding:14px 13px;font-weight:700;font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:9px}
.tb{padding:7px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;
  font-family:"DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.tb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--verde)}

/* hoja */
#layer{position:fixed;inset:0;z-index:60;display:none}
#layer.on{display:block}
.veil{position:absolute;inset:0;background:rgba(4,9,18,.72);backdrop-filter:blur(3px);animation:fd .18s ease}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sh{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:470px;background:var(--n850);
  border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow-y:auto;
  animation:up .3s cubic-bezier(.2,.95,.3,1)}
.sh.full{top:0;border-radius:0;background:var(--n900);display:flex;flex-direction:column}
@keyframes up{from{transform:translate(-50%,24px);opacity:.5}to{transform:translate(-50%,0);opacity:1}}
.grab{width:36px;height:4px;border-radius:99px;background:var(--n700);margin:0 auto 13px}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.shh h2{margin:0;font-size:17px;font-weight:700}
.xc{color:var(--tx3);padding:6px 8px;font-size:15px}

/* teclado */
.kzone{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0}
.kamt{text-align:center;font-size:46px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kamt .c{font-size:19px;color:var(--tx3);vertical-align:.55em;margin-right:5px;font-weight:600}
.kamt.zero{color:var(--tx3)}
.kamt.bump{animation:bump .13s ease}
@keyframes bump{50%{transform:scale(1.04)}}
.khint{text-align:center;font-size:12px;color:var(--tx2);margin-top:9px;min-height:18px}
.khint.warn{color:var(--rojo)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ch{flex:none;border:1px solid var(--n700);border-radius:99px;padding:8px 13px;font-size:13px;background:var(--n800);
  display:flex;align-items:center;gap:7px}
.ch i{width:7px;height:7px;border-radius:50%}
.ch.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 18%,var(--n800));font-weight:700}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}
.qk button{border:1px solid var(--n700);border-radius:11px;padding:9px 0;font-family:"DM Mono",monospace;
  font-size:12.5px;color:var(--tx2);background:var(--n800)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pad button{background:var(--n800);border-radius:13px;padding:15px 0;font-size:20px;font-weight:600;
  font-variant-numeric:tabular-nums;transition:background .1s}
.pad button:active{background:var(--n750)}
.pad button.fn{color:var(--tx2);font-size:17px}
.pagos{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:var(--n850,var(--n900));
  border:1px solid var(--n700);border-radius:13px;padding:4px;margin-bottom:12px}
.pagos button{border-radius:10px;padding:10px 8px;font-size:12.5px;font-weight:600;color:var(--tx2);
  background:transparent;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .16s,color .16s}
.pagos button svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.7;fill:none}
.pagos button.on{background:var(--n700);color:var(--tx1)}
.pagos button.on.cr{background:rgba(245,179,60,.18);color:var(--ambar)}
.pagos .hint{grid-column:1/-1;font-size:11px;color:var(--tx3);text-align:center;padding:2px 0 4px;line-height:1.45}
.meta2{display:flex;gap:8px;margin:12px 0}
.meta2 button{flex:1;border:1px solid var(--n700);border-radius:11px;padding:10px;font-size:12.5px;color:var(--tx2);
  display:flex;align-items:center;justify-content:center;gap:7px;background:var(--n800)}
.meta2 button.set{border-color:var(--verde);color:var(--verde)}

.src{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--n800);border:1px solid var(--n700);
  border-radius:13px;padding:12px;margin-bottom:8px}
.src .pp{width:8px;height:8px;border-radius:50%;flex:none}
.src .sn{flex:1;font-weight:600;font-size:13.5px}
.src .sn em{display:block;font-style:normal;font-size:11px;color:var(--ambar);font-weight:500;margin-top:2px}
.src .sv{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--tx2)}
.alert{background:var(--rojo-d);border:1px solid rgba(255,96,96,.3);border-radius:14px;padding:13px 14px;
  font-size:13.5px;line-height:1.55;margin-bottom:14px;color:#FFC9C0}
.alert b{color:var(--rojo);font-weight:800}
.mvz{background:var(--n800);border-radius:14px;padding:14px;margin-bottom:12px}
.mvz .mvv{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.mvz .col{flex:1;min-width:0}
.mvz .col .lb2{font-size:10.5px;color:var(--tx2);margin-bottom:3px}
.mvz .col .vv2{font-family:"DM Mono",monospace;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.mvz .col .vv2.dn{color:var(--rojo)}.mvz .col .vv2.up{color:var(--verde)}
.mvz .ar{color:var(--tx3);flex:none}
.note2{font-size:12px;color:var(--tx3);line-height:1.6}
.note2 b{color:var(--tx2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));
  background:var(--n750);border:1px solid var(--n700);padding:11px 17px;border-radius:99px;font-size:12.5px;z-index:70;
  animation:fd .18s ease;max-width:88%;text-align:center;box-shadow:0 14px 34px -12px #000}
.toast b{color:var(--verde)}
.float{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:38px;font-weight:800;color:var(--rojo);
  z-index:80;pointer-events:none;animation:fl 1.05s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,12px) scale(.86)}18%{opacity:1;transform:translate(-50%,0) scale(1.06)}
  60%{opacity:1;transform:translate(-50%,-18px) scale(1)}100%{opacity:0;transform:translate(-50%,-34px)}}

/* setup */
.setup{max-width:470px;margin:0 auto;padding:34px 20px 46px}
.setup h1{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:14px 0 10px}
.setup h1 em{font-style:normal;color:var(--verde)}
.setup .sb{color:var(--tx2);font-size:14px;line-height:1.65;margin:0 0 22px}
.stepdot{display:flex;gap:5px;margin-bottom:16px}
.stepdot i{width:22px;height:3px;border-radius:99px;background:var(--n700)}
.stepdot i.on{background:var(--verde)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="root"></div>
<div id="layer"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* ============ util ============ */
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
var RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
var DAY=86400000;
function pad(n){return String(n).padStart(2,"0");}
function n2(v){return Math.round((+v||0)*100)/100;}
function fmt(v){return n2(v).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});}
function sfmt(v){var x=n2(v);return x%1===0?x.toLocaleString("es-PE"):fmt(x);}
function ent(v){return Math.round(+v||0).toLocaleString("es-PE");}
function uid(){return Math.random().toString(36).slice(2,10);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(q,r){return (r||document).querySelector(q);}
function els(q,r){return Array.prototype.slice.call((r||document).querySelectorAll(q));}
function d0(d){var x=new Date(d);x.setHours(0,0,0,0);return x;}

/* ============ estado ============ */
var KEY="plata_data";
var KEY_LEGACY="plata_v3";
var S=null, V={tab:"resumen",filtro:null,pago:null,confirm:null}, SH={};

function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r) return JSON.parse(r);
    var leg=localStorage.getItem(KEY_LEGACY);
    if(leg){ try{localStorage.setItem(KEY,leg);}catch(e){} return JSON.parse(leg); }
    return null;
  }catch(e){return null;}
}
function save(){
  try{ if(S) S._ts=Date.now(); localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  empujar();
}

function cuentasBase(){return[
  {id:uid(),nombre:"Restaurantes",tope:250,c:1},
  {id:uid(),nombre:"Discotecas",tope:150,c:3},
  {id:uid(),nombre:"Cine",tope:60,c:4},
  {id:uid(),nombre:"Taxis",tope:60,c:2},
  {id:uid(),nombre:"Otros",tope:40,c:5,sys:true}
];}

/* ============ ciclo ============ */
function ciclo(){
  var hoy=d0(new Date()), d=Math.min(28,Math.max(1,S.diaInicio||1));
  var ini=new Date(hoy.getFullYear(),hoy.getMonth(),d);
  if(hoy.getDate()<d) ini=new Date(hoy.getFullYear(),hoy.getMonth()-1,d);
  var fin=new Date(ini.getFullYear(),ini.getMonth()+1,d); fin.setDate(fin.getDate()-1);
  var dias=Math.round((d0(fin)-d0(ini))/DAY)+1;
  var dia=Math.round((hoy-d0(ini))/DAY)+1;
  return {ini:ini,fin:fin,dias:dias,dia:Math.max(1,Math.min(dias,dia)),
    key:ini.getFullYear()+"-"+pad(ini.getMonth()+1),
    nombre:MESES[ini.getMonth()]+" "+ini.getFullYear()};
}

/* ============ cálculos ============ */
function ahorroMes(){return n2(S.ingreso*(S.ahorro.pct||0)/100);}
function fijosMes(){return n2(S.fijos.reduce(function(a,f){return a+(+f.monto||0);},0));}
function cuotasActivas(){return S.cuotas.filter(function(q){return q.pagadas<q.total;});}
function cuotasMes(){return n2(cuotasActivas().reduce(function(a,q){return a+(+q.cuota||0);},0));}
function deudaTotal(){return n2(cuotasActivas().reduce(function(a,q){return a+q.cuota*(q.total-q.pagadas);},0));}
/* tarjeta: lo cargado con crédito ESTE ciclo (bruto — el banco cobra el total, no el neto) */
function tarjetaCiclo(){return n2(S.gastos.reduce(function(a,g){return g.pago==="credito"?a+neto(g):a;},0));}
/* lo que quedó debiendo del ciclo anterior y ya se descuenta de este mes */
function tarjetaArrastre(){return n2((S.tarjeta&&S.tarjeta.arrastre)||0);}
function tarjetaPagada(){return !!(S.tarjeta&&S.tarjeta.pagado);}
/* renuncias: plata que NO gastaste por elegir la opción barata */
function renuncias(){return (S.renuncias||[]);}
function renunciadoTotal(){return n2(renuncias().reduce(function(a,r){return a+(+r.monto||0);},0));}
function renunciadoLibre(){return n2(renuncias().reduce(function(a,r){return r.guardado?a:a+(+r.monto||0);},0));}
function repartible(){return n2(S.ingreso-ahorroMes()-fijosMes()-cuotasMes()-tarjetaArrastre());}
function topes(){return n2(S.cuentas.reduce(function(a,c){return a+(+c.tope||0);},0));}
function sinRepartir(){return n2(repartible()-topes());}
function neto(g){return n2(g.monto-(g.reemb||0));}
function gastoDe(id){return n2(S.gastos.reduce(function(a,g){return g.cuenta===id?a+neto(g):a;},0));}
function gastado(){return n2(S.gastos.reduce(function(a,g){return a+neto(g);},0));}
function cobrosLista(){
  var l=[];
  S.gastos.forEach(function(g){ if((g.reemb||0)>0 && !g.cobrado)
    l.push({id:g.id,src:"g",quien:(g.quien||"Sin nombre"),monto:g.reemb,nota:g.nota,ts:g.ts}); });
  (S.cobros||[]).forEach(function(c){ l.push({id:c.id,src:"c",quien:(c.quien||"Sin nombre"),monto:c.monto,nota:c.nota,ts:c.ts}); });
  return l;
}
function porCobrar(){return n2(cobrosLista().reduce(function(a,x){return a+x.monto;},0));}
function cobrosPorQuien(){
  var m={};
  cobrosLista().forEach(function(x){ (m[x.quien]=m[x.quien]||{quien:x.quien,total:0,items:[]}); m[x.quien].total=n2(m[x.quien].total+x.monto); m[x.quien].items.push(x); });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.total-a.total;});
}
function quienesUsados(){
  var v=[];
  cobrosLista().forEach(function(x){ if(x.quien!=="Sin nombre"&&v.indexOf(x.quien)<0) v.push(x.quien); });
  S.gastos.forEach(function(g){ if(g.quien&&v.indexOf(g.quien)<0) v.push(g.quien); });
  return v.slice(0,6);
}
function teQueda(){return n2(repartible()-gastado());}
function cta(id){for(var i=0;i<S.cuentas.length;i++)if(S.cuentas[i].id===id)return S.cuentas[i];return null;}
function rojas(){return S.cuentas.filter(function(c){return gastoDe(c.id)>c.tope;})
  .sort(function(a,b){return (gastoDe(b.id)-b.tope)-(gastoDe(a.id)-a.tope);});}
function sanas(){return S.cuentas.filter(function(c){return gastoDe(c.id)<=c.tope;});}
function excedido(){return n2(rojas().reduce(function(a,c){return a+(gastoDe(c.id)-c.tope);},0));}
function promDe(id){var g=S.gastos.filter(function(x){return x.cuenta===id;});
  return g.length<2?0:g.reduce(function(a,x){return a+x.monto;},0)/g.length;}

/* ============ cierre de mes ============ */
function cerrarMes(manual){
  var C=ciclo(), sobra=teQueda(), tj=tarjetaCiclo(), rn=renunciadoTotal();
  S.historial.unshift({key:S.cicloKey,nombre:S.cicloNombre||S.cicloKey,ingreso:S.ingreso,
    ahorro:ahorroMes(),ahorroApartado:!!S.ahorro.apartado,fijos:fijosMes(),cuotas:cuotasMes(),repartible:repartible(),
    gastado:gastado(),sobrante:sobra,tarjeta:tj,tarjetaPrevia:tarjetaArrastre(),renunciado:rn,
    cuentas:S.cuentas.map(function(c){return{nombre:c.nombre,tope:c.tope,gastado:gastoDe(c.id)};})});
  S.historial=S.historial.slice(0,36);
  // solo se acumula lo que de verdad apartaste + lo que sobró
  S.ahorro.acumulado=n2((S.ahorro.acumulado||0)+Math.max(0,sobra));
  if(!S.ahorro.apartado) S.ahorro.noApartados=n2((S.ahorro.noApartados||0)+ahorroMes());
  S.ahorro.apartado=false;
  // cuotas avanzan
  S.cuotas.forEach(function(q){ if(q.pagadas<q.total) q.pagadas++; });
  S.cobros=S.cobros||[];
  S.gastos.forEach(function(g){ if((g.reemb||0)>0 && !g.cobrado)
    S.cobros.push({id:uid(),quien:g.quien||"Sin nombre",monto:g.reemb,nota:g.nota,ts:g.ts}); });
  S.gastos=[];
  S.renuncias=[];
  // la tarjeta del mes que cierra se cobra el mes que entra: se descuenta del ingreso
  S.tarjeta=S.tarjeta||{arrastre:0,pagado:false};
  S.tarjeta.arrastre=tj; S.tarjeta.pagado=false;
  S.cicloKey=C.key; S.cicloNombre=C.nombre;
  save();
  if(manual) toast(tj>0?("Mes cerrado. S/ "+sfmt(tj)+" de tarjeta se descuentan de este mes.")
                       :"Mes cerrado. Sobrante al ahorro.");
}
function chequearCiclo(){
  if(!S) return;
  var C=ciclo();
  if(S.cicloKey!==C.key){ cerrarMes(false); toast("Nuevo mes: <b>"+C.nombre+"</b>"); }
}

}

/* ============ vistas ============ */
function pintaVista(){
  var v=el("#view"); if(!v)return;
  v.innerHTML = V.tab==="resumen"?vResumen(): V.tab==="gastos"?vGastos(): V.tab==="plan"?vPlan(): vAjustes();
  if(V.tab==="resumen") dibujaChart();
  if(V.tab==="ajustes") pintaSync();
  requestAnimationFrame(function(){ els(".tk i",v).forEach(function(i){i.style.width=i.dataset.w+"%";}); });
}

/* ---- resumen ---- */
function vResumen(){
  var C=ciclo(), rep=repartible(), g=gastado(), q=teQueda();
  var tjc=tarjetaCiclo(), tja=tarjetaArrastre();
  var pct=rep>0?Math.min(100,Math.round(g/rep*100)):0;
  var diasQ=Math.max(1,C.dias-C.dia+1), porDia=q>0?q/diasQ:0;
  var ideal=rep/C.dias*C.dia, delta=g-ideal;
  var h='<div class="blk"><div class="bh" style="margin-bottom:8px"><div>'+
    '<div class="bt">Gastado este mes</div>'+
    '<div class="amt">S/ '+fmt(g)+'<span class="of">de S/ '+sfmt(rep)+' para gastar · día '+C.dia+'/'+C.dias+'</span></div></div>'+
    '<div class="ring" style="--p:'+pct+';'+(pct>=100?'--rc:var(--rojo)':pct>80?'--rc:var(--ambar)':'')+'"><i>'+pct+'%</i></div></div>'+
    '<div class="minis">'+
      '<div class="mini"><div class="k2">Te queda</div><b class="'+(q<0?"hot":"")+'">S/ '+sfmt(q)+'</b></div>'+
      '<div class="mini"><div class="k2">Por día</div><b>S/ '+sfmt(porDia)+'</b></div>'+
      (tjc>0
        ?'<div class="mini"><div class="k2">Con tarjeta</div><b class="warn2">S/ '+sfmt(tjc)+'</b></div>'
        :'<div class="mini"><div class="k2">Ahorrado</div><b class="ok">S/ '+sfmt(S.ahorro.acumulado)+'</b></div>')+
    '</div>'+

    (rep>0?'<div class="pace '+(delta>rep*.05?"bad":"ok")+'"><i></i><span>'+
      (delta>rep*.05?'Vas S/ '+ent(delta)+' por encima del ritmo. Baja a S/ '+ent(Math.max(0,q/diasQ))+' por día para llegar.'
       :delta<-rep*.05?'Vas S/ '+ent(-delta)+' por debajo del ritmo. Así cierras con saldo.'
       :'Vas justo en el ritmo del mes.')+'</span></div>':'')+
    '</div>';

  // ---- tarjeta: lo del mes pasado que ya se descontó ----
  if(tja>0){
    h+='<div class="blk tight" style="background:'+(tarjetaPagada()?'var(--verde-d)':'var(--ambar-d)')+
       ';border:1px solid '+(tarjetaPagada()?'rgba(49,211,160,.28)':'rgba(245,179,60,.28)')+'">'+
      '<div style="display:flex;align-items:center;gap:11px">'+
      '<div style="flex:1"><div style="font-weight:700;font-size:13.5px;color:var('+(tarjetaPagada()?'--verde':'--ambar')+')">'+
        (tarjetaPagada()?'Tarjeta del mes pasado · pagada':'Debes S/ '+sfmt(tja)+' de la tarjeta')+'</div>'+
      '<div style="font-size:12px;color:var(--tx2);margin-top:3px;line-height:1.5">'+
        (tarjetaPagada()
          ?'Ya está fuera. Los S/ '+sfmt(tja)+' salieron de tu ingreso de este mes.'
          :'Es lo que cargaste el mes pasado. <b>Ya está descontado</b> de tus S/ '+sfmt(rep)+' para gastar — no lo gastes dos veces.')+
      '</div></div>'+
      (tarjetaPagada()?'':'<button class="btn" style="width:auto;padding:9px 13px;background:var(--ambar);color:#231700;font-size:12.5px;flex:none" data-tjpag="1">Ya la pagué</button>')+
      '</div></div>';
  }
  // ---- tarjeta: lo que estás cargando este mes ----
  if(tjc>0){
    var pctj=rep>0?Math.round(tjc/rep*100):0;
    h+='<div class="blk tight">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:11px;margin-bottom:8px">'+
      '<div style="font-weight:700;font-size:13.5px">Este mes vas con tarjeta</div>'+
      '<div style="font-family:\'DM Mono\',monospace;font-size:15px;color:var(--ambar)">S/ '+sfmt(tjc)+'</div></div>'+
      '<div class="segbar"><i style="width:'+Math.min(100,pctj)+'%"></i></div>'+
      '<div class="note2" style="margin-top:9px">'+
        (tjc>=rep*0.5
          ?'<b style="color:var(--ambar)">Más de la mitad de tu mes es deuda.</b> El '+(S.diaInicio||1)+' te van a llegar S/ '+sfmt(S.ingreso)+' y S/ '+sfmt(tjc)+' ya tienen dueño.'
          :'Se te cobra el mes que viene. Tu próximo mes arranca con S/ '+sfmt(n2(S.ingreso-tjc))+' reales, no con S/ '+sfmt(S.ingreso)+'.')+
      '</div></div>';
  }

  if(!S.ahorro.apartado && ahorroMes()>0){
    h+='<div class="blk tight" style="background:var(--ambar-d);border:1px solid rgba(245,179,60,.28)">'+
      '<div style="display:flex;align-items:center;gap:11px">'+
      '<div style="flex:1"><div style="font-weight:700;font-size:13.5px;color:var(--ambar)">Aparta tu ahorro</div>'+
      '<div style="font-size:12px;color:var(--tx2);margin-top:3px">S/ '+sfmt(ahorroMes())+' de este mes siguen en tu cuenta, mezclados con todo.</div></div>'+
      '<button class="btn" style="width:auto;padding:9px 13px;background:var(--ambar);color:#231700;font-size:12.5px" data-apart="1">Ya lo aparté al banco</button>'+
      '</div></div>';
  }

  h+='<div class="blk"><div class="bh"><h3>Cómo va el mes</h3><span class="bt">gasto vs ritmo</span></div>'+
     '<canvas id="cv"></canvas></div>';

  var rj=rojas();
  if(rj.length){
    h+='<div class="red"><div class="rh"><span class="dot"></span><h3>Excedido</h3>'+
       '<span class="tt">+'+sfmt(excedido())+'</span></div>';
    rj.forEach(function(c){
      var gc=gastoDe(c.id);
      h+='<button class="rr" data-ct="'+c.id+'"><span class="nm">'+esc(c.nombre)+
         '<em>'+sfmt(gc)+' de '+sfmt(c.tope)+'</em></span><span class="ex">+'+sfmt(gc-c.tope)+'</span></button>';
    });
    h+='</div>';
  }else if(S.gastos.length){
    h+='<div class="okbox"><span>✓</span><div>Nada en rojo. <b>Todas tus cuentas dentro del tope.</b></div></div>';
  }

  // ---- lo que te aguantaste ----
  var rnT=renunciadoTotal(), rnL=renunciadoLibre();
  if(rnT>0){
    var lst=renuncias().slice().sort(function(a,b){return b.ts-a.ts;}).slice(0,4);
    h+='<div class="blk"><div class="bh"><h3>Te la aguantaste</h3>'+
       '<span class="pill ok">S/ '+sfmt(rnT)+'</span></div>';
    lst.forEach(function(r){
      var c=cta(r.cuenta), tag=r.guardado?"button":"button";
      h+='<button class="row" '+(r.guardado?"disabled":'data-rr="'+r.id+'"')+' style="'+(r.guardado?"opacity:.55":"")+'"><span class="sw" style="background:var(--c'+((c&&c.c)||5)+')"></span>'+
        '<span class="rn"><b>'+esc(r.nota||((c&&c.nombre)||"Ahorro"))+'</b>'+
        '<span>'+((c?esc(c.nombre):"—"))+(r.guardado?" · guardado":" · toca para decidir")+'</span></span>'+
        '<span class="rv" style="color:var(--verde)">+'+sfmt(r.monto)+'</span></button>';
    });
    if(renuncias().length>4) h+='<div class="note2" style="margin-top:9px">y '+(renuncias().length-4)+' más.</div>';
    if(rnL>0){
      h+='<div class="note2" style="margin-top:12px">Esta plata <b>sigue en tu presupuesto</b>. Toca un ítem para ahorrarlo, moverlo a otra cuenta o dejarlo como gasto. Si no decides, se va sola al ahorro cuando cierre el mes.</div>';
      if(renuncias().filter(function(r){return !r.guardado;}).length>1)
        h+='<div class="sp"></div><button class="btn" style="background:var(--verde);color:#04241B" data-rguard="1">Ahorrar todo · S/ '+sfmt(rnL)+'</button>';
    }else{
      h+='<div class="note2" style="margin-top:12px">Todo esto ya salió de tu presupuesto y está en tu ahorro. Plata que no existía hace un mes.</div>';
    }
    h+='</div>';
  }

  var otr=S.cuentas.filter(function(c){return c.sys;})[0];
  if(otr && gastado()>0){
    var go=gastoDe(otr.id), pc=go/gastado()*100;
    if(pc>=25 && go>0){
      h+='<div class="blk tight" style="background:var(--ambar-d);border:1px solid rgba(245,179,60,.28)">'+
        '<div style="font-weight:700;font-size:13px;color:var(--ambar);margin-bottom:4px">Otros ya es el '+Math.round(pc)+'% de tu gasto</div>'+
        '<div class="note2">Ahí hay categorías escondidas. Mira qué anotaste en Otros y sepáralo en una cuenta propia con su tope — si no, en dos meses no sabrás en qué se te fue la plata.</div></div>';
    }
  }

  var grupos=cobrosPorQuien();
  if(grupos.length){
    h+='<div class="blk"><div class="bh"><h3>Por cobrar</h3>'+
       '<span class="pill warn">S/ '+sfmt(porCobrar())+'</span></div>';
    grupos.forEach(function(gr){
      h+='<div class="row"><span class="sw" style="background:var(--ambar-d);color:var(--ambar);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800">'+
        esc(gr.quien.slice(0,2).toUpperCase())+'</span>'+
        '<span class="rn"><b>'+esc(gr.quien)+'</b><span>'+gr.items.length+' '+(gr.items.length===1?"gasto":"gastos")+'</span></span>'+
        '<span class="rv" style="color:var(--ambar)">S/ '+sfmt(gr.total)+'</span>'+
        '<button class="btn" style="width:auto;padding:7px 11px;font-size:11.5px;background:var(--n750);flex:none" data-pag="'+esc(gr.quien)+'">Me pagó</button></div>';
    });
    h+='<div class="note2" style="margin-top:11px">Al cerrar el mes lo que no te hayan pagado se arrastra al siguiente. No se pierde.</div></div>';
  }

  var sn=sanas();
  if(sn.length){
    h+='<div class="blk"><div class="bh"><h3>Cuentas</h3><span class="bt">gastado / tope</span></div>';
    sn.forEach(function(c){

/* ============ eventos de vista ============ */
function wireVista(v){
  v.addEventListener("click",function(e){
    var t=e.target.closest("[data-ct],[data-goto],[data-f],[data-pf],[data-del],[data-pag],[data-apart],[data-tjpag],[data-rguard],[data-rr],[data-sacar],[data-col],[data-rmc],[data-addc],[data-rmf],[data-addf],[data-rmq],[data-addq],[data-salir],[data-entrar],[data-cp],[data-dl],[data-rs],[data-cerrar],[data-cerrar2],[data-reset],[data-reset2],[data-cancel]");
    if(!t)return; var d=t.dataset;
    if(d.ct!==undefined&&d.ct){ abrirGasto(d.ct); return; }
    if(d.goto){ V.tab=d.goto; pintaNav(); pintaTabs(); pintaVista(); return; }
    if(d.f!==undefined){ V.filtro=d.f||null; pintaVista(); return; }
    if(d.pf!==undefined){ V.pago=d.pf||null; pintaVista(); return; }
    if(d.del){ S.gastos=S.gastos.filter(function(g){return g.id!==d.del;}); save(); pintaVista(); toast("Gasto borrado"); return; }
    if(d.pag){
      var q=d.pag, tot=0;
      S.gastos.forEach(function(g){ if((g.reemb||0)>0 && !g.cobrado && (g.quien||"Sin nombre")===q){ g.cobrado=true; tot+=g.reemb; } });
      S.cobros=(S.cobros||[]).filter(function(c){ if((c.quien||"Sin nombre")===q){ tot+=c.monto; return false; } return true; });
      save(); pintaVista(); toast("<b>"+esc(q)+"</b> te pagó S/ "+sfmt(tot)); return;
    }
    if(d.apart){ S.ahorro.acumulado=n2((S.ahorro.acumulado||0)+ahorroMes()); S.ahorro.apartado=true;
      save(); pintaVista(); toast("Bien. <b>Ese ahorro ya es real.</b>"); return; }
    if(d.rr){ abrirResolverRenuncia(d.rr); return; }
    if(d.rguard){ guardarRenunciado(); return; }
    if(d.tjpag){ S.tarjeta=S.tarjeta||{arrastre:0,pagado:false}; S.tarjeta.pagado=true;
      save(); pintaVista(); toast("Tarjeta pagada. <b>Empiezas limpio.</b>"); return; }
    if(d.sacar){ abrirSacar(); return; }
    if(d.col){ var c=cta(d.col); if(c){c.c=c.c%6+1; save(); pintaVista();} return; }
    if(d.rmc){ var cx=cta(d.rmc); if(cx&&cx.sys){ toast("Otros no se puede borrar: es donde cae lo que no clasificas"); return; }
      S.cuentas=S.cuentas.filter(function(c){return c.id!==d.rmc;});
      S.gastos=S.gastos.filter(function(g){return g.cuenta!==d.rmc;}); save(); pintaVista(); return; }
    if(d.addc){ var u=S.cuentas.map(function(c){return c.c;});
      var f=[1,2,3,4,5,6].filter(function(k){return u.indexOf(k)<0;})[0]||1;
      S.cuentas.push({id:uid(),nombre:"Nueva cuenta",tope:0,c:f}); save(); pintaVista(); return; }
    if(d.rmf){ S.fijos=S.fijos.filter(function(x){return x.id!==d.rmf;}); save(); pintaVista(); return; }
    if(d.addf){ S.fijos.push({id:uid(),nombre:"Nuevo fijo",monto:0}); save(); pintaVista(); return; }
    if(d.rmq){ S.cuotas=S.cuotas.filter(function(x){return x.id!==d.rmq;}); save(); pintaVista(); return; }
    if(d.addq){ abrirCuota(); return; }
    if(d.salir){ salir(); return; }
    if(d.entrar){ wireAuth(); return; }
    if(d.cp){ copiar(); return; }
    if(d.dl){ bajar(); return; }
    if(d.rs){ restaurar(); return; }
    if(d.cerrar){ V.confirm="cerrar"; pintaVista(); return; }
    if(d.cerrar2){ cerrarMes(true); V.confirm=null; V.tab="resumen"; pintaNav(); pintaTabs(); pintaVista(); return; }
    if(d.reset){ V.confirm="reset"; pintaVista(); return; }
    if(d.reset2){ try{localStorage.removeItem(KEY);localStorage.removeItem(KEY_LEGACY);}catch(e){} S=null; V.confirm=null; mount(); return; }
    if(d.cancel){ V.confirm=null; pintaVista(); return; }
  });
  v.addEventListener("change",function(e){
    var t=e.target, d=t.dataset;
    if(t.id==="ing"){ S.ingreso=Math.max(0,+t.value||0); save(); pintaVista(); return; }
    if(t.id==="dini"){ S.diaInicio=Math.min(28,Math.max(1,+t.value||1)); save(); pintaVista(); return; }
    if(d.nm){ var c=cta(d.nm); if(c){c.nombre=t.value.trim()||"Cuenta"; save();} return; }
    if(d.tp){ var c2=cta(d.tp); if(c2){c2.tope=Math.max(0,+t.value||0); save(); pintaVista();} return; }
    if(d.fn){ var f=S.fijos.filter(function(x){return x.id===d.fn;})[0]; if(f){f.nombre=t.value.trim()||"Fijo"; save();} return; }
    if(d.fm){ var f2=S.fijos.filter(function(x){return x.id===d.fm;})[0]; if(f2){f2.monto=Math.max(0,+t.value||0); save(); pintaVista();} return; }
  });
  v.addEventListener("input",function(e){

/* ============ gráfico ============ */
function dibujaChart(){
  var cv=el("#cv"); if(!cv)return;
  var C=ciclo(), rep=repartible();
  var dpr=Math.min(3,window.devicePixelRatio||1), w=cv.clientWidth, hh=120;
  cv.width=w*dpr; cv.height=hh*dpr;
  var x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,hh);
  var n=C.dias, hoy=C.dia;
  var ser=new Array(n).fill(0);
  S.gastos.forEach(function(g){
    var i=Math.round((d0(new Date(g.ts))-d0(C.ini))/DAY);
    if(i>=0&&i<n) ser[i]+=neto(g);
  });
  var acc=[],a=0; ser.forEach(function(v){a+=v;acc.push(a);});
  var maxY=Math.max(rep,acc[hoy-1]||0)*1.06||1;
  var pad={t:8,b:16}, H=hh-pad.t-pad.b;
  function px(i){return n<=1?0:i/(n-1)*w;}
  function py(v){return pad.t+H-(v/maxY)*H;}
  x.strokeStyle="#1B2B42"; x.lineWidth=1;
  [0,.5,1].forEach(function(k){var y=Math.round(pad.t+H-k*H)+.5;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();});
  x.setLineDash([3,4]); x.strokeStyle="#4A6383";
  x.beginPath(); x.moveTo(px(0),py(rep/n)); x.lineTo(px(n-1),py(rep)); x.stroke(); x.setLineDash([]);
  var pts=[]; for(var i=0;i<hoy;i++) pts.push([px(i),py(acc[i])]);
  if(pts.length){
    var over=acc[hoy-1]>rep/n*hoy;
    var g=x.createLinearGradient(0,pad.t,0,pad.t+H);
    g.addColorStop(0,over?"rgba(255,96,96,.30)":"rgba(49,211,160,.28)");
    g.addColorStop(1,over?"rgba(255,96,96,0)":"rgba(49,211,160,0)");
    x.beginPath(); x.moveTo(pts[0][0],pad.t+H);
    pts.forEach(function(p){x.lineTo(p[0],p[1]);});
    x.lineTo(pts[pts.length-1][0],pad.t+H); x.closePath(); x.fillStyle=g; x.fill();
    x.beginPath(); pts.forEach(function(p,k){k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);});
    x.strokeStyle=over?"#FF6060":"#31D3A0"; x.lineWidth=2.2; x.lineJoin="round"; x.stroke();
    var L=pts[pts.length-1];
    x.beginPath(); x.arc(L[0],L[1],3.6,0,7); x.fillStyle=over?"#FF6060":"#31D3A0"; x.fill();
  }
  x.fillStyle="#4A6383"; x.font='9px "DM Mono",monospace';
  x.fillText("día 1",0,hh-3);
  x.textAlign="right"; x.fillText("S/ "+ent(rep),w,pad.t+9); x.fillText("día "+n,w,hh-3); x.textAlign="left";
}

/* mandar al ahorro de verdad: baja el tope de la cuenta y sube el acumulado */
function guardarRenunciado(){
  var movido=0, bloqueado=0;
  (S.renuncias||[]).forEach(function(r){
    if(r.guardado) return;
    var c=cta(r.cuenta);
    if(!c){ r.guardado=true; movido=n2(movido+r.monto); S.ahorro.acumulado=n2((S.ahorro.acumulado||0)+r.monto); return; }
    var libre=n2(c.tope-gastoDe(c.id));
    var mv=Math.min(r.monto,Math.max(0,libre));
    if(mv<=0){ bloqueado=n2(bloqueado+r.monto); return; }
    c.tope=n2(c.tope-mv);
    S.ahorro.acumulado=n2((S.ahorro.acumulado||0)+mv);
    movido=n2(movido+mv);
    if(mv>=r.monto-0.005){ r.guardado=true; } else { r.monto=n2(r.monto-mv); }
  });
  save(); pintaVista();
  if(movido>0) toast("S/ "+sfmt(movido)+" fuera de tu presupuesto. <b>Ya es ahorro real.</b>");
  else toast("Esas cuentas ya no tienen saldo libre. No se puede guardar plata que ya gastaste.");
}

function renunciaAhorrar(id){
  var r=null; (S.renuncias||[]).forEach(function(x){ if(x.id===id && !x.guardado) r=x; });
  if(!r) return;
  var c=cta(r.cuenta);
  if(!c){ r.guardado=true; S.ahorro.acumulado=n2((S.ahorro.acumulado||0)+r.monto);
    save(); cerrarHoja(); pintaVista(); toast("Ahorrado."); return; }
  var libre=n2(c.tope-gastoDe(c.id)), mv=Math.min(r.monto,Math.max(0,libre));
  if(mv<=0){ toast(esc(c.nombre)+" ya no tiene saldo libre. No se puede ahorrar plata que ya gastaste."); return; }
  c.tope=n2(c.tope-mv); S.ahorro.acumulado=n2((S.ahorro.acumulado||0)+mv);
  var msg="S/ "+sfmt(mv)+" fuera de tu presupuesto. <b>Ya es ahorro real.</b>";
  if(mv>=r.monto-0.005){ r.guardado=true; } else { r.monto=n2(r.monto-mv); msg="Solo había S/ "+sfmt(mv)+" libres. El resto queda pendiente."; }

}

function resolver(from){
  var c=cta(SH.cuenta), ex=SH.exceso;
  if(from==="__no"){ commit(SH.monto,c.id,SH.nota,SH.fecha); toast("Registrado. <b>"+esc(c.nombre)+"</b> queda en rojo."); return; }
  if(from==="__sr"){ var mv=Math.min(sinRepartir(),ex); c.tope=n2(c.tope+mv);
    commit(SH.monto,c.id,SH.nota,SH.fecha); toast("S/ "+sfmt(mv)+" de lo no repartido → <b>"+esc(c.nombre)+"</b>"); return; }
  var f=cta(from); if(!f)return;
  var mv=Math.min(n2(f.tope-gastoDe(f.id)),ex);
  f.tope=n2(f.tope-mv); c.tope=n2(c.tope+mv);
  commit(SH.monto,c.id,SH.nota,SH.fecha);
  toast(esc(f.nombre)+" −"+sfmt(mv)+" → <b>"+esc(c.nombre)+"</b>");
}

function copiar(){
  var txt=JSON.stringify(S);
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(function(){toast("Copia en el portapapeles");},function(){fb(txt);});
  else fb(txt);
  function fb(t){var ta=el("#rest");if(ta){ta.value=t;ta.select();toast("Copia lista abajo — cópiala");}}
}
function bajar(){
  try{
    var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="plata-"+ciclo().key+".json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},1200);
    toast("Copia descargada");
  }catch(e){ toast("No se pudo descargar"); }
}
function restaurar(){
  var ta=el("#rest"); if(!ta)return;
  try{
    var o=JSON.parse(ta.value);
    if(!o||!o.cuentas) throw 0;
    S=normaliza(o); save(); V.tab="resumen"; pintaNav(); pintaTabs(); pintaVista(); toast("Copia restaurada");
  }catch(e){ toast("Esa copia no se puede leer"); }
}
function normaliza(o){
  o.v=4; o.gastos=o.gastos||[]; o.cuentas=o.cuentas||[]; o.fijos=o.fijos||[]; o.cuotas=o.cuotas||[];
  o.tarjeta=o.tarjeta||{arrastre:0,pagado:false};
  o.renuncias=o.renuncias||[];
  o.tarjeta.arrastre=+o.tarjeta.arrastre||0; o.tarjeta.pagado=!!o.tarjeta.pagado;
  o.ultPago=(o.ultPago==="credito")?"credito":"efectivo";
  o.gastos.forEach(function(g){ if(g.pago!=="credito") g.pago="efectivo"; });
  o.historial=o.historial||[]; o.cobros=o.cobros||[]; o.ahorro=o.ahorro||{pct:0,acumulado:0,apartado:false,rupturas:[]};
  o.ahorro.rupturas=o.ahorro.rupturas||[]; o.ahorro.noApartados=o.ahorro.noApartados||0; o.diaInicio=o.diaInicio||1; o.ingreso=o.ingreso||0;
  var hayOtros=false;
  o.cuentas.forEach(function(c){ if(c.sys||String(c.nombre||"").trim().toLowerCase()==="otros"){ c.sys=true; hayOtros=true; } });
  if(!hayOtros){
    var ah=(o.ingreso||0)*((o.ahorro.pct||0)/100);
    var fj=(o.fijos||[]).reduce(function(a,f){return a+(+f.monto||0);},0);
    var qt=(o.cuotas||[]).filter(function(q){return q.pagadas<q.total;}).reduce(function(a,q){return a+(+q.cuota||0);},0);
    var rep=(o.ingreso||0)-ah-fj-qt;
    var tp=(o.cuentas||[]).reduce(function(a,c){return a+(+c.tope||0);},0);
    var u=o.cuentas.map(function(c){return c.c;});
    var col=[5,6,3,4,2,1].filter(function(k){return u.indexOf(k)<0;})[0]||5;
    o.cuentas.push({id:uid(),nombre:"Otros",tope:Math.max(0,Math.round(rep-tp)),c:col,sys:true});
  }
  return o;
}


/* ============================================================
   CUENTA Y SINCRONIZACIÓN
   ============================================================ */
var SB=null, USER=null, SYNC="local", pushT=null;

function cfgOK(){
  var c=window.PLATA_CONFIG||{};
  return !!(c.URL && c.ANON && /^https:\/\//.test(c.URL));
}
function estadoSync(){
  if(!cfgOK()) return {t:"Solo en este equipo",c:"var(--tx3)"};
  if(!USER)    return {t:"Sin cuenta",c:"var(--tx3)"};
  if(SYNC==="ok")   return {t:"Guardado en tu cuenta",c:"var(--verde)"};
  if(SYNC==="wait") return {t:"Guardando…",c:"var(--ambar)"};
  if(SYNC==="err")  return {t:"Sin conexión · se guardó aquí",c:"var(--ambar)"};
  return {t:"—",c:"var(--tx3)"};
}
function pintaSync(){
  var e=el("#syncst"); if(!e) return;
  var s=estadoSync(); e.textContent=s.t; e.style.color=s.c;
}

function empujar(){
  if(!SB||!USER||!S) return;
  SYNC="wait"; pintaSync();
  clearTimeout(pushT);
  pushT=setTimeout(function(){
    SB.from("presupuestos").upsert({user_id:USER.id,data:S,updated_at:new Date().toISOString()})
      .then(function(r){ SYNC=r.error?"err":"ok"; pintaSync(); })
      .catch(function(){ SYNC="err"; pintaSync(); });
  },1200);
}

function tieneDatos(o){ return !!(o && o.cuentas && o.cuentas.length); }

async function jalar(){
  try{
    var r=await SB.from("presupuestos").select("data,updated_at").eq("user_id",USER.id).maybeSingle();
    if(r.error) return null;
    return r.data ? r.data.data : null;
  }catch(e){ return null; }
}

async function sincronizarAlEntrar(){
  var local=load(), remoto=await jalar();
  var usarRemoto=false;
  if(tieneDatos(remoto) && !tieneDatos(local)) usarRemoto=true;
  else if(tieneDatos(remoto) && tieneDatos(local)){
    usarRemoto = (+(remoto._ts||0)) > (+(local._ts||0));
  }
  if(usarRemoto){
    S=normaliza(remoto);
    try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  }else{
    S=local?normaliza(local):null;
    if(tieneDatos(S)) empujar();
  }
  if(S && !S.cicloKey){ var C=ciclo(); S.cicloKey=C.key; S.cicloNombre=C.nombre; }
  SYNC="ok";
}

/* ---------- pantalla de cuenta ---------- */
var AU={modo:"entrar",cargando:false,msg:"",em:"",pw:""};
function authHTML(){
  if(AU.modo==="olvide") return olvideHTML();
  if(AU.modo==="nueva")  return nuevaHTML();
  var entrar=AU.modo==="entrar";
  return '<div class="setup">'+

    '<p class="sb">'+(entrar
      ?'Con tu correo y contraseña. Tus datos te siguen a cualquier teléfono o computadora.'
      :'Con un correo y una contraseña. Nadie más ve tus números: cada cuenta solo puede leer los suyos.')+'</p>'+
    '<div class="blk">'+
      '<div class="fld"><div class="lb">Correo</div>'+
      '<input type="text" id="aem" inputmode="email" autocomplete="email" value="'+esc(AU.em||"")+'" placeholder="tucorreo@gmail.com"></div>'+
      '<div class="fld" style="margin:0"><div class="lb">Contraseña'+(entrar?'':' (mínimo 6)')+'</div>'+
      '<input type="password" id="apw" autocomplete="'+(entrar?'current-password':'new-password')+'" value="'+esc(AU.pw||"")+'" placeholder="••••••"></div>'+

    '<div class="sp"></div>'+

    '<div class="sp"></div>'+
    '<button class="btn gh" id="amodo">'+(entrar?'No tengo cuenta, crear una':'Ya tengo cuenta, entrar')+'</button>'+
    (entrar?'<div class="sp"></div><button class="btn gh" id="aolv" style="color:var(--tx3)">Olvidé mi contraseña</button>':'')+
    '<div class="sp"></div>'+
    '<button class="btn gh" id="alocal" style="color:var(--tx3)">Usar sin cuenta en este equipo</button>'+

function olvideHTML(){
  return '<div class="setup">'+
    '<div class="lbl">Plata del mes</div>'+
    '<h1>Recupera <em>tu cuenta</em>.</h1>'+
    '<p class="sb">Te mandamos un enlace al correo. Lo abres desde este mismo teléfono y pones una contraseña nueva.</p>'+
    '<div class="blk"><div class="fld" style="margin:0"><div class="lb">Tu correo</div>'+
    '<input type="text" id="aem" inputmode="email" autocomplete="email" value="'+esc(AU.em||"")+'" placeholder="tucorreo@gmail.com"></div></div>'+
    (AU.msg?'<div class="note2" style="color:var('+(AU.ok?'--verde':'--rojo')+');margin-bottom:11px">'+esc(AU.msg)+'</div>':'')+
    '<div class="sp"></div>'+
    '<button class="btn pri" id="aenv">'+(AU.cargando?'Enviando…':'Mandarme el enlace')+'</button>'+
    '<div class="sp"></div>'+
    '<button class="btn gh" id="avolver">Volver</button>'+
    '<p class="note2" style="margin-top:16px">Si no te llega en un par de minutos, revisa spam. El enlace vence en una hora.</p>'+
    '</div>';
}
function nuevaHTML(){
  return '<div class="setup">'+
    '<div class="lbl">Plata del mes</div>'+
    '<h1>Pon tu <em>nueva contraseña</em>.</h1>'+
    '<p class="sb">Entraste con el enlace del correo. Elige una contraseña y ya quedas dentro.</p>'+
    '<div class="blk"><div class="fld" style="margin:0"><div class="lb">Nueva contraseña (mínimo 6)</div>'+
    '<input type="password" id="anw" autocomplete="new-password" placeholder="••••••"></div></div>'+
    (AU.msg?'<div class="note2" style="color:var(--rojo);margin-bottom:11px">'+esc(AU.msg)+'</div>':'')+
    '<div class="sp"></div>'+
    '<button class="btn pri" id="anok">'+(AU.cargando?'Guardando…':'Guardar y entrar')+'</button>'+
    '</div>';
}
function wireAuth(){
  root.innerHTML=authHTML();

  // ---- pedir enlace de recuperación ----
  if(AU.modo==="olvide"){
    el("#avolver").addEventListener("click",function(){
      AU.em=(el("#aem").value||"").trim(); AU.modo="entrar"; AU.msg=""; AU.ok=false; wireAuth(); });
    el("#aenv").addEventListener("click",async function(){
      if(AU.cargando) return;
      var em=(el("#aem").value||"").trim(); AU.em=em;
      if(!em||em.indexOf("@")<0){ AU.msg="Escribe un correo válido."; AU.ok=false; return wireAuth(); }
      AU.cargando=true; AU.msg=""; wireAuth();
      try{
        var base=location.origin+location.pathname;
        await SB.auth.resetPasswordForEmail(em,{redirectTo:base});
      }catch(e){}
      AU.cargando=false; AU.ok=true;
      AU.msg="Listo. Si ese correo tiene cuenta, ya te llegó el enlace. Ábrelo desde este mismo equipo.";
      wireAuth();
    });
    el("#aem").addEventListener("keydown",function(e){ if(e.key==="Enter") el("#aenv").click(); });
    return;
  }

  // ---- poner contraseña nueva ----
  if(AU.modo==="nueva"){
    var inw=el("#anw"); setTimeout(function(){ try{inw.focus();}catch(e){} },80);
    el("#anok").addEventListener("click",async function(){
      if(AU.cargando) return;
      var pw=el("#anw").value||"";
      if(pw.length<6){ AU.msg="La contraseña necesita al menos 6 caracteres."; return wireAuth(); }
      AU.cargando=true; AU.msg=""; wireAuth();
      try{
        var r=await SB.auth.updateUser({password:pw});
        AU.cargando=false;
        if(r.error){
          var em2=r.error.message||"";
          AU.msg=/should be different|same.*password/i.test(em2)
            ? "Esa es la contraseña que ya tenías. Pon una distinta."
            : (/expired|invalid/i.test(em2) ? "El enlace venció. Pide uno nuevo." : em2);
          return wireAuth();
        }
        var ses=await SB.auth.getSession();
        USER=(ses&&ses.data&&ses.data.session)?ses.data.session.user:USER;
        AU={modo:"entrar",cargando:false,msg:"",em:"",pw:""};
        if(USER){ await sincronizarAlEntrar(); mount(); toast("Contraseña cambiada. <b>Ya estás dentro.</b>"); }
        else wireAuth();
      }catch(e){ AU.cargando=false; AU.msg="No se pudo cambiar. Intenta de nuevo."; wireAuth(); }
    });
    el("#anw").addEventListener("keydown",function(e){ if(e.key==="Enter") el("#anok").click(); });
    return;
  }

  var bo=el("#aolv");
  if(bo) bo.addEventListener("click",function(){
    AU.em=el("#aem").value||""; AU.modo="olvide"; AU.msg=""; AU.ok=false; wireAuth(); });
  el("#amodo").addEventListener("click",function(){
    AU.em=el("#aem").value||""; AU.pw=el("#apw").value||"";
    AU.modo=AU.modo==="entrar"?"crear":"entrar"; AU.msg=""; wireAuth(); });
  el("#alocal").addEventListener("click",function(){
    SB=null; USER=null; SYNC="local";
    S=load(); if(S){ S=normaliza(S); save(); }
    mount();
  });
  el("#ago").addEventListener("click",async function(){
    if(AU.cargando) return;
    var em=(el("#aem").value||"").trim(), pw=el("#apw").value||"";
    AU.em=em; AU.pw=pw;
    if(!em||em.indexOf("@")<0){ AU.msg="Escribe un correo válido."; return wireAuth(); }
    if(pw.length<6){ AU.msg="La contraseña necesita al menos 6 caracteres."; return wireAuth(); }
    AU.cargando=true; AU.msg=""; wireAuth();
    try{
      var r = AU.modo==="entrar"
        ? await SB.auth.signInWithPassword({email:em,password:pw})
        : await SB.auth.signUp({email:em,password:pw});
      AU.cargando=false;
      if(r.error){
        var m=r.error.message||"";
        if(/Invalid login/i.test(m)) AU.msg="Correo o contraseña incorrectos.";
        else if(/already registered|already exists/i.test(m)) AU.msg="Ese correo ya tiene cuenta. Entra en vez de crearla.";
        else if(/Email not confirmed/i.test(m)) AU.msg="Falta confirmar el correo. Revisa tu bandeja, o desactiva la confirmación en Supabase.";
        else AU.msg=m;
        return wireAuth();
      }
      if(!r.data || !r.data.session){
        AU.msg="Cuenta creada. Revisa tu correo para confirmarla y luego entra.";
        AU.modo="entrar"; return wireAuth();
      }
      USER=r.data.user;
      await sincronizarAlEntrar();
      mount();
    }catch(e){
      AU.cargando=false; AU.msg="No se pudo conectar. Revisa tu internet."; wireAuth();
    }
  });
  el("#apw").addEventListener("keydown",function(e){ if(e.key==="Enter") el("#ago").click(); });
}

/* ---------- arranque ---------- */
async function boot(){
  // service worker
  if("serviceWorker" in navigator){
    try{ navigator.serviceWorker.register("./sw.js").catch(function(){}); }catch(e){}
  }
  if(!cfgOK()){
    SYNC="local";
    S=load();
    if(S){ S=normaliza(S); if(!S.cicloKey){var C1=ciclo(); S.cicloKey=C1.key; S.cicloNombre=C1.nombre;} save(); }
    return mount();
  }
  if(!window.supabase || !window.supabase.createClient){
    SYNC="local"; S=load(); if(S){ S=normaliza(S); save(); }
    mount();
    toast("No se pudo cargar el módulo de cuentas. Estás usando la app solo en este equipo.");
    return;
  }
  try{
    SB=window.supabase.createClient(window.PLATA_CONFIG.URL, window.PLATA_CONFIG.ANON,
      {auth:{persistSession:true,autoRefreshToken:true}});
  }catch(e){ SB=null; }
  if(!SB){
    SYNC="local"; S=load(); if(S){ S=normaliza(S); save(); } return mount();
  }
  // ¿venimos del enlace de recuperación del correo?
  var hash=(location.hash||"")+"&"+(location.search||"");
  var esRecuperar=/type=recovery/.test(hash);
  if(esRecuperar){
    try{ SB.auth.onAuthStateChange(function(ev){ if(ev==="PASSWORD_RECOVERY"){ AU.modo="nueva"; wireAuth(); } }); }catch(e){}
  }
  try{
    var ses=await SB.auth.getSession();
    if(ses && ses.data && ses.data.session){
      USER=ses.data.session.user;
      if(esRecuperar){
        try{ history.replaceState(null,"",location.pathname); }catch(e){}
        AU.modo="nueva"; AU.msg=""; AU.cargando=false;
        return wireAuth();
      }
      await sincronizarAlEntrar();
      return mount();
    }
  }catch(e){}
  if(esRecuperar){ AU.modo="entrar"; AU.msg="El enlace venció o ya se usó. Pide uno nuevo."; }
  wireAuth();
}
async function salir(){
  try{ if(SB) await SB.auth.signOut(); }catch(e){}
  USER=null; SYNC="local"; AU={modo:"entrar",cargando:false,msg:"",em:"",pw:""};
  wireAuth();
}

/* ============ toast ============ */
var tEl=null,tT=null;
function toast(html){
  if(tEl)tEl.remove();
  tEl=document.createElement("div"); tEl.className="toast"; tEl.innerHTML=html;
  document.body.appendChild(tEl);
  clearTimeout(tT); tT=setTimeout(function(){if(tEl){tEl.remove();tEl=null;}},2800);
}

/* ============ setup ============ */
var SU={paso:0,ingreso:800,pct:20,dia:1,cuentas:null};
function setupHTML(){
  if(!SU.cuentas) SU.cuentas=cuentasBase();
  var dots='<div class="stepdot">'+[0,1,2].map(function(i){return '<i class="'+(i<=SU.paso?"on":"")+'"></i>';}).join("")+'</div>';
  if(SU.paso===0){
    return '<div class="setup">'+dots+
      '<div class="lbl">Paso 1 de 3</div>'+
      '<h1>¿Cuánta plata recibes <em>al mes</em>?</h1>'+
      '<p class="sb">Y qué día te la dan. El mes de la app va a empezar ese día, no el 1.</p>'+
      '<div class="blk"><div class="fld"><div class="lb">Monto</div>'+
      '<input type="number" inputmode="decimal" id="s1a" value="'+SU.ingreso+'"></div>'+
      '<div class="fld" style="margin:0"><div class="lb">Día del mes (1 al 28)</div>'+
      '<input type="number" inputmode="numeric" id="s1b" min="1" max="28" value="'+SU.dia+'"></div></div>'+
      '<div class="sp"></div><button class="btn pri" id="next">Siguiente</button></div>';
  }
  if(SU.paso===1){
    var am=Math.round(SU.ingreso*SU.pct/100);
    return '<div class="setup">'+dots+
      '<div class="lbl">Paso 2 de 3</div>'+
      '<h1>Aparta tu ahorro <em>antes</em> de gastar.</h1>'+
      '<p class="sb">Si el ahorro es lo que sobra, no ahorras nunca. Este porcentaje sale primero y no entra al reparto.</p>'+
      '<div class="blk"><div style="text-align:center;padding:6px 0 14px">'+
      '<div style="font-size:40px;font-weight:800;color:var(--verde)" id="pv">'+SU.pct+'%</div>'+
      '<div class="bt" id="pm">S/ '+am+' de S/ '+SU.ingreso+' cada mes</div></div>'+
      '<input type="range" id="s2" min="0" max="50" step="5" value="'+SU.pct+'"></div>'+
      '<div class="note2" style="margin-top:10px">Puedes cambiarlo cuando quieras. Empezar en 10–20% es realista; 0% también es una respuesta válida.</div>'+
      '<div class="sp"></div><button class="btn pri" id="next">Siguiente</button>'+
      '<div class="sp"></div><button class="btn gh" id="back">Atrás</button></div>';
  }
  var rep=Math.round(SU.ingreso-SU.ingreso*SU.pct/100);
  return '<div class="setup">'+dots+
    '<div class="lbl">Paso 3 de 3</div>'+
    '<h1>Reparte lo que <em>sí</em> vas a gastar.</h1>'+
    '<p class="sb">Te quedan S/ '+rep+' después del ahorro. Ponle un tope a cada cosa, borra las que no uses y agrega las tuyas. Los fijos y las cuotas van después, en Plan.</p>'+
    '<div class="blk">'+SU.cuentas.map(function(c,i){
      return '<div class="row"><span class="sw" style="background:var(--c'+c.c+')"></span>'+
        '<span class="rn"><input type="text" value="'+esc(c.nombre)+'" data-sn="'+i+'" style="border:0;background:transparent;padding:0;font-weight:600;font-size:13.5px"></span>'+
        '<span style="width:82px;flex:none"><input type="number" inputmode="decimal" value="'+c.tope+'" data-st="'+i+'" style="text-align:right;padding:7px 9px"></span>'+
        (c.sys?'<span class="x" style="opacity:.28">•</span>':(SU.cuentas.length>1?'<button class="x" data-sx="'+i+'">✕</button>':''))+'</div>';
    }).join("")+
    '<div class="sp"></div><button class="btn gh" id="sadd">+ Agregar cuenta</button>'+
    '<div class="sp"></div><div class="dsg tot"><span class="n2">Sin repartir</span><span class="v2" id="s3s">—</span></div></div>'+
    '<div class="sp"></div><button class="btn pri" id="go">Crear mi mes</button>'+
    '<div class="sp"></div><button class="btn gh" id="back">Atrás</button>'+
    '<p class="note2" style="margin-top:16px;text-align:center">Todo se guarda solo en este teléfono. Nadie más lo ve.</p></div>';
}
function wireSetup(){
  var n=el("#next"), b=el("#back"), g=el("#go");
  if(n) n.addEventListener("click",function(){
    if(SU.paso===0){ SU.ingreso=Math.max(0,+el("#s1a").value||0); SU.dia=Math.min(28,Math.max(1,+el("#s1b").value||1)); }
    SU.paso++; root.innerHTML=setupHTML(); wireSetup();
  });
  if(b) b.addEventListener("click",function(){ SU.paso--; root.innerHTML=setupHTML(); wireSetup(); });
  var s2=el("#s2");
  if(s2) s2.addEventListener("input",function(){
    SU.pct=+s2.value; el("#pv").textContent=SU.pct+"%";
    el("#pm").textContent="S/ "+Math.round(SU.ingreso*SU.pct/100)+" de S/ "+SU.ingreso+" cada mes";
  });
  if(SU.paso===2){
    var sync=function(){
      SU.cuentas.forEach(function(c,i){
        var a=el('[data-sn="'+i+'"]'), b=el('[data-st="'+i+'"]');
        if(a) c.nombre=a.value; if(b) c.tope=Math.max(0,+b.value||0);
      });
    };
    var redraw=function(){ root.innerHTML=setupHTML(); wireSetup(); };
    if(!root._swired){ root._swired=true;
    root.addEventListener("click",function(e){
      var t=e.target.closest("[data-sx],#sadd"); if(!t)return;
      sync();
      if(t.id==="sadd"){
        var u=SU.cuentas.map(function(c){return c.c;});
        var f=[1,2,3,4,5,6].filter(function(k){return u.indexOf(k)<0;})[0]||((SU.cuentas.length%6)+1);
        SU.cuentas.push({id:uid(),nombre:"",tope:0,c:f});
      }else{
        SU.cuentas.splice(+t.dataset.sx,1);
      }
      redraw();
    }); }
    var sum=function(){
      var t=0; SU.cuentas.forEach(function(c,i){var e2=el('[data-st="'+i+'"]'); if(e2) t+=+e2.value||0;});
      var rep=SU.ingreso-SU.ingreso*SU.pct/100, d=n2(rep-t);
      var o=el("#s3s"); if(o){ o.textContent=(d<0?"−":"")+"S/ "+sfmt(Math.abs(d));
        o.style.color=d<0?"var(--rojo)":"var(--verde)"; }
    };
    if(!root._siwired){ root._siwired=true; root.addEventListener("input",sum); } sum();
    g.addEventListener("click",function(){
      var cs=SU.cuentas.map(function(c,i){
        var a=el('[data-sn="'+i+'"]'), b=el('[data-st="'+i+'"]');
        return {id:c.id,c:c.c,sys:!!c.sys,nombre:((a?a.value:c.nombre)||"").trim()||"Cuenta",
          tope:Math.max(0,+(b?b.value:c.tope)||0)};
      }).filter(function(c){return c.tope>0||c.nombre!=="Cuenta";});
      if(!cs.length) cs=[{id:uid(),c:1,nombre:"General",tope:Math.round(SU.ingreso*(100-SU.pct)/100)}];
      var C=null;
      S={v:3,ingreso:SU.ingreso,diaInicio:SU.dia,cicloKey:"",cicloNombre:"",
         ahorro:{pct:SU.pct,acumulado:0,apartado:false,rupturas:[]},
         fijos:[],cuotas:[],cuentas:cs,gastos:[],historial:[]};
      S=normaliza(S);
      C=ciclo(); S.cicloKey=C.key; S.cicloNombre=C.nombre;
      save(); V.tab="resumen"; mount();
    });
  }
}
